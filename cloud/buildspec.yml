version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - apt-get update -qq
      - apt-get install -y --no-install-recommends libgl1 libglib2.0-0 ffmpeg
      - python -m venv .venv
      - .venv/bin/python -m pip install -r requirements.lock
      - .venv/bin/python -m pip install --no-deps -e .
      - .venv/bin/python -m pip check
  build:
    commands:
      - .venv/bin/python cloud/acceptance.py run --output "$CODEBUILD_SRC_DIR/cloud-evidence" --source-zip-sha256 "$VISIONFLOW_SOURCE_ZIP_SHA256"
artifacts:
  base-directory: cloud-evidence
  files:
    - '**/*'
  discard-paths: no
