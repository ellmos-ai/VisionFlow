[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "visionflow"
version = "0.1.0"
description = "Reusable, configurable vision workflows for image, video, and camera inputs."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy==2.5.3", "opencv-python==5.0.0.93"]

[project.scripts]
visionflow = "visionflow.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
visionflow = ["web/*.html", "web/*.js", "web/*.css", "web/assets/*.png", "workflows/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
